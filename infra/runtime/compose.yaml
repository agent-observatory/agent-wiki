name: agent-wiki
x-logging: &logs
  driver: syslog
  options:
    syslog-address: unixgram:///run/wiki-syslog.sock
    tag: agent-wiki-{{.Name}}
    mode: non-blocking
    max-buffer-size: 1m
x-app: &app
  image: ghcr.io/agent-observatory/agent-wiki-app:${IMAGE_TAG:?IMAGE_TAG required}
  restart: unless-stopped
  init: true
  mem_limit: 2g
  networks: [wiki]
  logging: *logs
  depends_on:
    postgres:
      condition: service_healthy
services:
  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/agent-wiki/data/caddy:/data
      - /srv/agent-wiki/data/config:/config
    networks: [wiki]
    logging: *logs
  web:
    image: ghcr.io/agent-observatory/agent-wiki-web:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    init: true
    mem_limit: 2g
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    networks: [wiki]
    logging: *logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
  api:
    <<: *app
    env_file: api.env
    command: ["node", "dist/apps/api/src/server.js"]
    environment:
      SERVICE_NAME: agent-wiki-api
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 4
  worker:
    <<: *app
    env_file: worker.env
    command: ["node", "dist/apps/api/src/worker.js"]
    environment:
      SERVICE_NAME: agent-wiki-worker
    cpus: 0.5
    stop_grace_period: 120s
  postgres:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    mem_limit: 3g
    stop_grace_period: 120s
    environment:
      POSTGRES_USER: wiki_owner
      POSTGRES_DB: agent_wiki
      POSTGRES_PASSWORD: ${PG_OWNER_PASSWORD}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
    command:
      [
        "postgres",
        "-c",
        "ssl=on",
        "-c",
        "ssl_cert_file=/tls/server.crt",
        "-c",
        "ssl_key_file=/tls/server.key",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
        "-c",
        "max_connections=60",
        "-c",
        "shared_buffers=512MB",
        "-c",
        "log_statement=none",
      ]
    ports: ["5432:5432"]
    volumes:
      - /srv/agent-wiki/data/postgres:/var/lib/postgresql/data
      - /srv/agent-wiki/data/tls:/tls:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [wiki]
    logging: *logs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_owner -d agent_wiki"]
      interval: 10s
      timeout: 5s
      retries: 10
networks:
  wiki:
    ipam:
      config:
        - subnet: 172.30.0.0/24
