#cloud-config
package_update: true
packages: [curl, rsyslog, jq, openssl, iptables-persistent]
write_files:
  - path: /etc/apparmor.d/rsyslog.d/agent-wiki
    content: |
      /run/wiki-syslog.sock rw,
  - path: /etc/rsyslog.d/30-agent-wiki.conf
    content: |
      input(type="imuxsock" Socket="/run/wiki-syslog.sock" CreatePath="on")
      template(name="WikiJSON" type="string" string="%msg%\n")
      if $programname startswith 'agent-wiki-' then {
        # Only structured application events enter OCI; DB/plain logs stay local.
        if ($msg contains '"severityNumber":' and $msg contains '"eventName":') then {
          action(type="omfile" file="/var/log/agent-wiki/events.jsonl" template="WikiJSON" fileCreateMode="0640")
        }
        action(type="omfile" file="/var/log/agent-wiki/apps.jsonl" template="WikiJSON" fileCreateMode="0640")
        stop
      }
  - path: /etc/logrotate.d/agent-wiki
    content: |
      /var/log/agent-wiki/*.jsonl {
        daily
        maxsize 25M
        rotate 3
        compress
        missingok
        notifempty
        copytruncate
      }
  - path: /usr/local/sbin/wiki-mount
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      device=/dev/oracleoci/oraclevdb
      for i in $(seq 1 120); do [ -b "$device" ] && break; sleep 5; done
      [ -b "$device" ] || exit 1
      if ! blkid "$device" >/dev/null; then mkfs.ext4 -L wiki-data "$device"; fi
      mkdir -p /srv/agent-wiki/data
      uuid=$(blkid -s UUID -o value "$device")
      grep -q "$uuid" /etc/fstab || echo "UUID=$uuid /srv/agent-wiki/data ext4 defaults,_netdev 0 2" >> /etc/fstab
      mountpoint -q /srv/agent-wiki/data || mount /srv/agent-wiki/data
      mkdir -p /srv/agent-wiki/data/{postgres,k3s,tls} /opt/agent-wiki
      chown ubuntu:ubuntu /opt/agent-wiki
runcmd:
  - install -d -o syslog -g adm -m 0750 /var/log/agent-wiki
  - systemctl restart rsyslog
  - iptables -I INPUT 1 -p tcp -m multiport --dports 22,80,443,5432 -j ACCEPT
  - mkdir -p /etc/iptables
  - sh -c "iptables-save > /etc/iptables/rules.v4"
  - /usr/local/sbin/wiki-mount
  - systemctl daemon-reload
  # Install the pinned K3s runtime after the data volume is attached; no Compose boot service.
