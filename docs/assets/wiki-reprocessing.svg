<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="820" viewBox="0 0 1560 820" role="img" aria-labelledby="title desc"><title id="title">원문을 보존하며 분석·조립을 개선한다</title><desc id="desc">Retry는 실패한 청크부터 이어간다. Reprocess는 성공한 분석 범위를 새 분석으로 비교하고 사용자가 확인한 정정만 반영한다. Reassemble은 기존 주장을 모델 호출 없이 새 페이지 Version으로 조립한다. 분석 정정은 사용자의 과거 결정 변경과 구분한다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1560" height="820" fill="#FFFFFF"/>
<text x="40" y="42" font-size="16" font-weight="700" fill="#526A86">AGENT WIKI / ARCHITECTURE</text>
<text x="40" y="98" font-size="34" font-weight="700" fill="#172C4B">원문을 보존하며 분석·조립을 개선한다</text>
<path d="M40 137 H1520" stroke="#172C4B" stroke-width="2"/>
<rect x="40" y="180" width="460" height="180" rx="6" fill="#FDE7C2" stroke="#C89A55"/>
<text x="60" y="222" font-size="20" font-weight="700" fill="#172C4B">Retry · 실패 부분 재시도</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="60" y="240" color="#172C4B">
  <path d="M5 5m0 1a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-12a1 1 0 0 1 -1 -1z" />
  <path d="M9 9h6v6h-6z" />
  <path d="M3 10h2" />
  <path d="M3 14h2" />
  <path d="M10 3v2" />
  <path d="M14 3v2" />
  <path d="M21 10h-2" />
  <path d="M21 14h-2" />
  <path d="M14 21v-2" />
  <path d="M10 21v-2" />
</svg>
<text x="94" y="260" font-size="18" font-weight="400" fill="#172C4B">실패한 청크부터 다시 실행</text>
<text x="60" y="291" font-size="18" font-weight="400" fill="#172C4B">성공한 청크·근거·처리 위치 유지</text>
<text x="60" y="322" font-size="18" font-weight="400" fill="#172C4B">반복 출력 오류는 3회 뒤 확인 필요</text>
<rect x="550" y="180" width="460" height="180" rx="6" fill="#EBDFFA" stroke="#AA8ACA"/>
<text x="570" y="222" font-size="20" font-weight="700" fill="#172C4B">Reprocess · 선택한 범위 재분석</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="570" y="240" color="#172C4B">
  <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" />
</svg>
<text x="604" y="260" font-size="18" font-weight="400" fill="#172C4B">성공한 실행의 원문 범위를 고정</text>
<text x="570" y="291" font-size="18" font-weight="400" fill="#172C4B">새 분석 또는 저장 출력 재검증</text>
<text x="570" y="322" font-size="18" font-weight="400" fill="#172C4B">이전 주장·근거와 변경 후보 비교</text>
<rect x="1060" y="180" width="460" height="180" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="1080" y="222" font-size="20" font-weight="700" fill="#172C4B">Reassemble · 페이지 재조립</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1080" y="240" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="1114" y="260" font-size="18" font-weight="400" fill="#172C4B">현재 Claims·Evidence를 다시 구성</text>
<text x="1080" y="291" font-size="18" font-weight="400" fill="#172C4B">제목별 묶음 · 근거 기록 시각</text>
<text x="1080" y="322" font-size="18" font-weight="400" fill="#172C4B">모델 호출 없음</text>
<path d="M270 360 V420" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<path d="M780 360 V420" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<path d="M1290 360 V420" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<rect x="40" y="420" width="460" height="190" rx="6" fill="#E3E7ED" stroke="#929EAD"/>
<text x="60" y="462" font-size="20" font-weight="700" fill="#172C4B">다음 처리 위치로 진행</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="60" y="480" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="94" y="500" font-size="18" font-weight="400" fill="#172C4B">같은 청크를 무한 반복하지 않음</text>
<text x="60" y="531" font-size="18" font-weight="400" fill="#172C4B">인증·할당량 오류는 별도로 분류</text>
<text x="60" y="562" font-size="18" font-weight="400" fill="#172C4B">원문과 과거 실행 이력은 보존</text>
<rect x="550" y="420" width="460" height="190" rx="6" fill="#DBEAFE" stroke="#7EA6D8"/>
<text x="570" y="462" font-size="20" font-weight="700" fill="#172C4B">검토 후보 · 아직 미반영</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="570" y="480" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="604" y="500" font-size="18" font-weight="400" fill="#172C4B">기존 지식을 즉시 덮어쓰지 않음</text>
<text x="570" y="531" font-size="18" font-weight="400" fill="#172C4B">에이전트가 개념별 차이를 설명</text>
<text x="570" y="562" font-size="18" font-weight="400" fill="#172C4B">사용자 확인 후 고정 Version에 반영</text>
<rect x="1060" y="420" width="460" height="190" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="1080" y="462" font-size="20" font-weight="700" fill="#172C4B">Wiki Page · 새 Version</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1080" y="480" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="1114" y="500" font-size="18" font-weight="400" fill="#172C4B">내용이 바뀐 주제만 새 Version</text>
<text x="1080" y="531" font-size="18" font-weight="400" fill="#172C4B">기존 Claim·검토 상태는 유지</text>
<text x="1080" y="562" font-size="18" font-weight="400" fill="#172C4B">과거 페이지도 조회 가능</text>
<path d="M780 610 V656" fill="none" stroke="#8054A3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-relation)"/>
<rect x="550" y="656" width="460" height="90" rx="6" fill="#E3E7ED" stroke="#929EAD"/>
<text x="570" y="698" font-size="20" font-weight="700" fill="#172C4B">분석 정정 ≠ 사용자 결정 변경</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="966" y="676" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="40" y="792" font-size="18" font-weight="700" fill="#172C4B">L1은 불변 · 입력/출력/캐시/추론 사용량을 분리 기록 · 정제 시작·중지는 사용자 명령</text>
</g></svg>
