<text x="40" y="395" font-size="18" font-weight="400" fill="#172C4B">“임베딩 비용” → 두 검색어를 담은 결정 문서 → “임베딩”만 제목에 있는 참고 문서보다 우선</text>
<text x="40" y="445" font-size="16" font-weight="400" fill="#172C4B">일반 조회 · AI 호출 없음     |     관련도는 사실 여부가 아님     |     “미뤘지 ↔ 보류” 같은 의미 차이는 별도 평가</text>
</g></svg>
