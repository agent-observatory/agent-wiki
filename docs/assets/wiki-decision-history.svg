<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1050" viewBox="0 0 1560 1050" role="img" aria-labelledby="title desc"><title id="title">결정 변경은 덮어쓰기 대신 관계로</title><desc id="desc">합성 예시. 서로 다른 증분의 Supabase 결정과 취소·OCI PostgreSQL 결정은 같은 대상의 주장이다. 각 원문과 주장을 보존하고 새 주장에서 이전 주장으로 근거 있는 대체 관계를 연결한다. 불명확한 충돌은 두 주장을 보존한다. 관계는 기존 PostgreSQL에 저장한다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1560" height="1050" fill="#FFFFFF"/>
<text x="40" y="42" font-size="16" font-weight="700" fill="#526A86">AGENT WIKI / ARCHITECTURE</text>
<text x="40" y="98" font-size="34" font-weight="700" fill="#172C4B">결정 변경은 덮어쓰기 대신 관계로</text>
<path d="M40 137 H1520" stroke="#172C4B" stroke-width="2"/>
<path d="M1070 48 H1118" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<text x="1132" y="54" font-size="16" font-weight="700" fill="#B35C00">정제·반영</text>
<path d="M1300 48 H1348" fill="none" stroke="#8054A3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-relation)"/>
<text x="1362" y="54" font-size="16" font-weight="700" fill="#8054A3">근거·관계</text>
<rect x="40" y="170" width="1480" height="48" rx="6" fill="#344256" stroke="#344256"/>
<text x="60" y="203" font-size="24" font-weight="700" fill="#FFFFFF">Workspace · 개인 작업     /     대상 · Agent Wiki 운영 DB</text>
<rect x="40" y="260" width="550" height="160" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="60" y="302" font-size="20" font-weight="700" fill="#172C4B">이전 증분 · L1 · Raw Sources</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="60" y="320" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="94" y="340" font-size="18" font-weight="400" fill="#172C4B">사용자: “DB는 Supabase로 하자.”</text>
<text x="60" y="371" font-size="18" font-weight="400" fill="#172C4B">원문 A · 발언 시각 · 고정 구간</text>
<rect x="970" y="260" width="550" height="160" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="990" y="302" font-size="20" font-weight="700" fill="#172C4B">새 증분 · L1 · Raw Sources</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="990" y="320" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="1024" y="340" font-size="18" font-weight="400" fill="#172C4B">사용자: “Supabase는 취소하고</text>
<text x="990" y="371" font-size="18" font-weight="400" fill="#172C4B">OCI에 PostgreSQL을 설치하자.”</text>
<path d="M315 420 V510" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<path d="M1245 420 V510" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<rect x="40" y="510" width="550" height="190" rx="6" fill="#E3E7ED" stroke="#929EAD"/>
<text x="60" y="552" font-size="20" font-weight="700" fill="#172C4B">이전 주장 · 보존</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="60" y="570" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="94" y="590" font-size="18" font-weight="400" fill="#172C4B">운영 DB = Supabase</text>
<text x="60" y="621" font-size="18" font-weight="400" fill="#172C4B">사용자 결정 · 과거 선택</text>
<text x="60" y="652" font-size="18" font-weight="400" fill="#172C4B">근거: 원문 A</text>
<rect x="970" y="510" width="550" height="190" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="990" y="552" font-size="20" font-weight="700" fill="#172C4B">새 주장 · 현재 선택</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="990" y="570" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="1024" y="590" font-size="18" font-weight="400" fill="#172C4B">운영 DB = OCI PostgreSQL</text>
<text x="990" y="621" font-size="18" font-weight="400" fill="#172C4B">사용자 결정 · 명시적인 변경</text>
<text x="990" y="652" font-size="18" font-weight="400" fill="#172C4B">근거: 새 증분의 정정 발언</text>
<path d="M970 590 H590" fill="none" stroke="#8054A3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-relation)"/>
<text x="664" y="564" font-size="20" font-weight="700" fill="#8054A3">대체 · supersedes</text>
<text x="639" y="624" font-size="16" font-weight="400" fill="#172C4B">같은 대상·범위 + 정정 근거</text>
<text x="644" y="657" font-size="16" font-weight="400" fill="#172C4B">도착 순서만으로 대체하지 않음</text>
<rect x="40" y="790" width="1480" height="190" rx="6" fill="#F1F2F4" stroke="#596679" stroke-width="2.5"/>
<path d="M46 790 H1514 Q1520 790 1520 796 V844 H40 V796 Q40 790 46 790" fill="#344256"/>
<text x="64" y="826" font-size="24" font-weight="700" fill="#FFFFFF">agent-wiki-db · 주장 Version과 근거를 연결</text>
<rect x="64" y="860" width="442" height="96" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<text x="84" y="902" font-size="20" font-weight="700" fill="#172C4B">명시적인 취소·대체</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="84" y="920" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="118" y="940" font-size="18" font-weight="400" fill="#172C4B">철회·대체 관계 + 변경 근거</text>
<rect x="530" y="860" width="442" height="96" rx="6" fill="#EBDFFA" stroke="#AA8ACA"/>
<text x="550" y="902" font-size="20" font-weight="700" fill="#172C4B">해석이 불분명한 충돌</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="550" y="920" color="#172C4B">
  <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
  <path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z" />
  <path d="M9 14l2 2l4 -4" />
</svg>
<text x="584" y="940" font-size="18" font-weight="400" fill="#172C4B">두 주장 보존 · 판단 보류</text>
<rect x="996" y="860" width="500" height="96" rx="6" fill="#DBEAFE" stroke="#7EA6D8"/>
<text x="1016" y="902" font-size="20" font-weight="700" fill="#172C4B">검색 → 재정렬 → 관계 확인</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="1016" y="920" color="#172C4B">
  <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12z" />
  <path d="M19 16h-12a2 2 0 0 0 -2 2" />
  <path d="M9 8h6" />
</svg>
<text x="1050" y="940" font-size="18" font-weight="400" fill="#172C4B">현재·과거·충돌과 근거를 함께 반환</text>
</g></svg>
