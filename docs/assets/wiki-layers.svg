<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1210" viewBox="0 0 1560 1210" role="img" aria-labelledby="title desc"><title id="title">수집·정제와 사용자 조회를 분리</title><desc id="desc">L1부터 L5의 논리 계층. 별도 Collector가 원문을 보관하고 백그라운드 실행이 정제한다. 작업 에이전트는 필요한 지식만 조회한다. Collector와 백그라운드 정제는 미구현이다. 번호는 배포 위치나 원격 처리 순서를 뜻하지 않는다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1560" height="1210" fill="#FFFFFF"/>
<text x="40" y="42" font-size="15" font-weight="700" fill="#526A86">AGENT WIKI / TARGET ARCHITECTURE</text>
<text x="40" y="98" font-size="34" font-weight="700" fill="#172C4B">수집·정제와 사용자 조회를 분리</text>
<path d="M40 137 H1520" stroke="#172C4B" stroke-width="2"/>
<path d="M1140 43 H1188" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<text x="1202" y="49" font-size="18" font-weight="700" fill="#B35C00">원문·지식 반영</text>
<path d="M1140 78 H1188" fill="none" stroke="#245CC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-query)"/>
<text x="1202" y="84" font-size="18" font-weight="700" fill="#245CC5">조회·답변</text>
<rect x="40" y="164" width="1480" height="46" rx="6" fill="#344256" stroke="#344256"/>
<text x="60" y="195" font-size="22" font-weight="700" fill="#FFFFFF">Workspace · 개인 작업</text>
<text x="780" y="194" font-size="19" font-weight="700" fill="#FFFFFF">Tag · agent-observatory / agent-wiki</text>
<rect x="40" y="240" width="1480" height="145" rx="6" fill="#DBEAFE" stroke="#7EA6D8"/>
<rect x="40" y="240" width="82" height="145" rx="6" fill="#344256" stroke="#344256"/>
<text x="56" y="324" font-size="31" font-weight="700" fill="#FFFFFF">L5</text>
<text x="146" y="283" font-size="25" font-weight="700" fill="#172C4B">Answers</text>
<text x="146" y="322" font-size="18" font-weight="400" fill="#172C4B">작업 에이전트</text>
<path d="M430 260 V365" stroke="#929EAD"/>
<text x="456" y="283" font-size="24" font-weight="700" fill="#172C4B">필요한 근거를 조회해 답변·작업</text>
<text x="456" y="331" font-size="21" font-weight="400" fill="#172C4B">현재는 단일 VM을 유지하고 분리는 후속으로 검토한다.</text>
<rect x="40" y="420" width="1480" height="145" rx="6" fill="#DBEAFE" stroke="#7EA6D8"/>
<rect x="40" y="420" width="82" height="145" rx="6" fill="#344256" stroke="#344256"/>
<text x="56" y="504" font-size="31" font-weight="700" fill="#FFFFFF">L4</text>
<text x="146" y="463" font-size="25" font-weight="700" fill="#172C4B">Query</text>
<text x="146" y="502" font-size="18" font-weight="400" fill="#172C4B">Wiki 서버</text>
<path d="M430 440 V545" stroke="#929EAD"/>
<text x="456" y="463" font-size="24" font-weight="700" fill="#172C4B">시작 Context · 키워드·별칭 검색</text>
<text x="456" y="511" font-size="21" font-weight="400" fill="#172C4B">VM 선택 이유 → 지식 A의 첫 번째 개정 · 근거: 원문 A의 1행</text>
<path d="M80 420 V385" fill="none" stroke="#245CC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-query)"/>
<rect x="40" y="600" width="1480" height="145" rx="6" fill="#D4EDE4" stroke="#74AA98"/>
<rect x="40" y="600" width="82" height="145" rx="6" fill="#344256" stroke="#344256"/>
<text x="56" y="684" font-size="31" font-weight="700" fill="#FFFFFF">L3</text>
<text x="146" y="643" font-size="25" font-weight="700" fill="#172C4B">Wiki</text>
<text x="146" y="682" font-size="18" font-weight="400" fill="#172C4B">Wiki 서버</text>
<path d="M430 620 V725" stroke="#929EAD"/>
<text x="456" y="643" font-size="24" font-weight="700" fill="#172C4B">Memory · Article · Glossary</text>
<text x="456" y="691" font-size="21" font-weight="400" fill="#172C4B">지식 A · 첫 번째 개정: 단일 VM 결정 / 사용자 결정 · 검토 미완료</text>
<path d="M80 600 V565" fill="none" stroke="#245CC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-query)"/>
<rect x="40" y="780" width="1480" height="145" rx="6" fill="#FDE7C2" stroke="#C89A55"/>
<rect x="40" y="780" width="82" height="145" rx="6" fill="#344256" stroke="#344256"/>
<text x="56" y="864" font-size="31" font-weight="700" fill="#FFFFFF">L2</text>
<text x="146" y="823" font-size="25" font-weight="700" fill="#172C4B">Ingest</text>
<text x="146" y="862" font-size="18" font-weight="400" fill="#172C4B">별도 정제 실행</text>
<path d="M430 800 V905" stroke="#929EAD"/>
<text x="456" y="823" font-size="24" font-weight="700" fill="#172C4B">군집화·기존 지식 비교 → 근거 연결 → 검증·반영</text>
<text x="456" y="871" font-size="21" font-weight="400" fill="#172C4B">정제·반영 기록: 원문 A의 1행 → 단일 VM 운영 주장 → 지식 A</text>
<path d="M80 780 V745" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<rect x="40" y="960" width="1480" height="145" rx="6" fill="#E3E7ED" stroke="#929EAD"/>
<rect x="40" y="960" width="82" height="145" rx="6" fill="#344256" stroke="#344256"/>
<text x="56" y="1044" font-size="31" font-weight="700" fill="#FFFFFF">L1</text>
<text x="146" y="1003" font-size="25" font-weight="700" fill="#172C4B">Raw sources</text>
<text x="146" y="1042" font-size="18" font-weight="400" fill="#172C4B">Collector → Wiki</text>
<path d="M430 980 V1085" stroke="#929EAD"/>
<text x="456" y="1003" font-size="24" font-weight="700" fill="#172C4B">별도 Collector가 수집한 기록의 불변 보관본</text>
<text x="456" y="1051" font-size="21" font-weight="400" fill="#172C4B">원문 A · 첫 번째 개정 · 1행: “지금은 단일 VM으로 운영하자.”</text>
<path d="M80 960 V925" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<text x="40" y="1163" font-size="20" font-weight="400" fill="#172C4B">설계안 · Collector와 백그라운드 정제는 미구현. 작업 대화에는 수집·정제 요청을 삽입하지 않는다.</text>
</g></svg>
