<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1170" viewBox="0 0 1920 1170" role="img" aria-labelledby="title desc"><title id="title">리니지 · 원문에서 검색 근거까지</title><desc id="desc">L1 원문과 기존 L3 지식 Version을 입력으로 L2가 정제하고 새 L3 지식과 주장별 원문 근거를 보존한다. L4는 반영된 지식의 검색 후보를 정렬하고 유효성을 확인해 고정 Version과 원문 근거를 반환한다. L5 에이전트는 CLI로 조회하며 새 정제 완료를 기다리지 않는다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1920" height="1170" fill="#FFFFFF"/>
