<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1260" viewBox="0 0 1560 1260" role="img" aria-labelledby="title desc"><title id="title">원문 → Claims · Decisions → Wiki Pages → 답변</title><desc id="desc">L1–L5와 L3 내부 지식 구성을 한 그림으로 설명한다. L2는 근거 ID로 원문을 연결하고 주제별 페이지를 구성한다. L3는 작은 주장·결정과 읽기용 페이지를 구분하며 과거 결정과 변경 이유를 보존한다. 현재 상태는 현재 결정 B·C에서, Decision History는 이전 결정 A와 B의 대체 관계에서 구성한다. 아래 제공자 변경은 합성 예시다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1560" height="1260" fill="#FFFFFF"/>
