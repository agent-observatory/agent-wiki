<text x="629" y="700" font-size="18" font-weight="400" fill="#172C4B">재정렬·리랭커 비교</text>
<text x="595" y="731" font-size="18" font-weight="400" fill="#172C4B">검색 적합도 ≠ 사실의 진실성</text>
<rect x="1086" y="620" width="530" height="136" rx="6" fill="#FDE7C2" stroke="#C89A55"/>
