<text x="94" y="400" font-size="18" font-weight="400" fill="#172C4B">고정 크기로 분할</text>
<text x="60" y="431" font-size="18" font-weight="400" fill="#172C4B">키워드 검색 결과 사용</text>
<path d="M328 400 H368" fill="none" stroke="#B35C00" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-ingest)"/>
<rect x="368" y="320" width="288" height="160" rx="6" fill="#FDE7C2" stroke="#C89A55"/>
<text x="388" y="362" font-size="20" font-weight="700" fill="#172C4B">대화 구조 청킹</text>
