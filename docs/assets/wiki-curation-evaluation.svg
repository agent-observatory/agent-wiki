<text x="64" y="581" font-size="24" font-weight="700" fill="#FFFFFF">선택 기준 · 예쁜 요약보다 올바른 결정과 근거</text>
<rect x="64" y="620" width="490" height="136" rx="6" fill="#DBEAFE" stroke="#7EA6D8"/>
<text x="84" y="662" font-size="20" font-weight="700" fill="#172C4B">검색 후보에 근거가 없음</text>
