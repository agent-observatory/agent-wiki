</svg>
<text x="118" y="700" font-size="18" font-weight="400" fill="#172C4B">후보 검색 · 별칭·분류 개선</text>
<text x="84" y="731" font-size="18" font-weight="400" fill="#172C4B">후속: 임베딩·혼합 검색 평가</text>
