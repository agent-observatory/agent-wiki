<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="880" viewBox="0 0 1680 880" role="img" aria-labelledby="title desc"><title id="title">청킹·맥락·리랭킹은 하나씩 비교</title><desc id="desc">같은 평가 자료와 모델 예산을 고정해 고정 분할, 구조 청킹, 세션 맥락, 규칙 재정렬, 모델 리랭커를 순차 비교한다. 정정·근거 정확도와 비용을 측정한다. 후보 검색에서 빠진 자료는 리랭커만으로 복구할 수 없다.</desc><defs><marker id="arrow-ingest" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#B35C00" stroke-width="2"/></marker><marker id="arrow-query" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#245CC5" stroke-width="2"/></marker><marker id="arrow-ops" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#68778B" stroke-width="2"/></marker><marker id="arrow-relation" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8054A3" stroke-width="2"/></marker></defs><g font-family="Noto Sans KR, sans-serif"><rect width="1680" height="880" fill="#FFFFFF"/>
<text x="40" y="42" font-size="16" font-weight="700" fill="#526A86">AGENT WIKI / ARCHITECTURE</text>
<text x="40" y="98" font-size="34" font-weight="700" fill="#172C4B">청킹·맥락·리랭킹은 하나씩 비교</text>
<path d="M40 137 H1640" stroke="#172C4B" stroke-width="2"/>
<rect x="40" y="180" width="1600" height="68" rx="6" fill="#344256" stroke="#344256"/>
<text x="64" y="222" font-size="24" font-weight="700" fill="#FFFFFF">같은 평가 자료 · 같은 모델·입출력 한도 · 한 번에 한 요소만 변경</text>
<rect x="40" y="320" width="288" height="160" rx="6" fill="#E3E7ED" stroke="#929EAD"/>
<text x="60" y="362" font-size="20" font-weight="700" fill="#172C4B">기준선</text>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="60" y="380" color="#172C4B">
