<text x="358" y="1054" font-size="18" font-weight="400" fill="#172C4B">{ &quot;type&quot;: &quot;decision&quot;, &quot;claim&quot;: &quot;동일 요청은 같은 멱등 키&quot;,</text>
<text x="358" y="1086" font-size="18" font-weight="400" fill="#172C4B">  &quot;evidence_status&quot;: &quot;user_confirmed&quot;, &quot;implementation&quot;: &quot;not_started&quot;,</text>
<text x="358" y="1118" font-size="18" font-weight="400" fill="#172C4B">  &quot;source&quot;: &quot;session-demo#e3&quot;, &quot;run_id&quot;: &quot;r7&quot; }</text>
