<text x="358" y="1326" font-size="21" font-weight="400" fill="#172C4B">e2 에이전트  “동일 요청에는 같은 멱등 키를 쓰는 정책을 제안합니다.”</text>
<text x="358" y="1365" font-size="21" font-weight="400" fill="#172C4B">e3 사용자  “좋아. 같은 키를 쓰자. 정책만 정했고 구현은 아직이야.”</text>
