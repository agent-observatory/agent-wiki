name: Cost and usage monitor
on:
  schedule:
    - cron: '13 0 * * *'
    - cron: '13 6,12,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: 정기 요약 / check: 새 이상만 / preview: 전송 없이 확인 / sample: 샘플 전송'
        type: choice
        options: [daily, check, preview, sample]
        default: daily
permissions:
  contents: read
concurrency:
  group: wiki-monitoring
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/monitoring/requirements.txt
      - name: Compare billing data and notify Slack
        env:
          OCI_COST_CONFIG: ${{ secrets.OCI_COST_CONFIG }}
          OCI_COST_NAMESPACE: ${{ secrets.OCI_COST_NAMESPACE }}
          OCI_COST_BUCKET: ${{ vars.OCI_COST_BUCKET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # GitHub can delay or omit scheduled runs. The reporter turns a later
          # scheduled check into the day's summary when the 09:13 KST run was missed.
          REPORT_MODE: ${{ inputs.mode || 'auto' }}
        run: python scripts/monitoring/cost_report.py --mode "$REPORT_MODE"
