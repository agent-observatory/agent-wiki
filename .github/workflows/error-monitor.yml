name: Application error monitor
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki-monitoring
  cancel-in-progress: false
jobs:
  errors:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/monitoring/requirements.txt
      - run: pip install -r scripts/monitoring/requirements.txt
      - name: Send Korean error summaries
        env:
          OCI_COST_CONFIG: ${{ secrets.OCI_COST_CONFIG }}
          OCI_LOG_CONFIG: ${{ secrets.OCI_LOG_CONFIG }}
          OCI_COST_NAMESPACE: ${{ secrets.OCI_COST_NAMESPACE }}
          OCI_COST_BUCKET: ${{ vars.OCI_COST_BUCKET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/monitoring/error_report.py
