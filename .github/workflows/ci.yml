name: Validate and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_runner:
        description: Image build runner (x86 uses ARM emulation)
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9-bookworm
        env:
          POSTGRES_USER: wiki_owner
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: agent_wiki
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiki_owner -d agent_wiki"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"
      - name: Validate infrastructure without OCI access
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform test
      - name: Check monitoring rules and delivery semantics
        run: python3 -m unittest discover -s scripts/monitoring -p 'test_*.py'
      - name: Check K3s runtime contracts
        run: python3 scripts/test-k3s.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm --prefix apps/agent-wiki-web ci
      - name: Prepare test roles
        env:
          PGPASSWORD: local-test-password
        run: |
          psql -h localhost -p 55432 -U wiki_owner -d agent_wiki -v ON_ERROR_STOP=1 -c "CREATE ROLE wiki_app LOGIN PASSWORD 'local-app-password'; CREATE ROLE wiki_admin LOGIN BYPASSRLS PASSWORD 'local-admin-password';"
      - run: npm run typecheck
      - run: scripts/test-local.sh
      - run: npm run build
      - name: Check diagrams
        run: python3 scripts/generate-wiki-diagrams.py && git diff --exit-code -- docs/assets
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ inputs.image_runner || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
            target: agent-wiki-api
          - name: worker
            context: .
            file: Dockerfile
            target: agent-wiki-worker
          - name: web
            context: apps/agent-wiki-web
            file: apps/agent-wiki-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: inputs.image_runner == 'ubuntu-24.04'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/agent-observatory/agent-wiki-${{ matrix.name }}:${{ github.sha }}
  deploy:
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy K3s workloads
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/wiki
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/wiki -o StrictHostKeyChecking=yes ubuntu@"$DEPLOY_HOST" 'mkdir -p /opt/agent-wiki/k3s-runtime/scripts /opt/agent-wiki/k3s-runtime/infra/k3s'
          scp -i ~/.ssh/wiki -o StrictHostKeyChecking=yes scripts/deploy-k3s.sh scripts/render-k3s.py scripts/k3s-secrets.py ubuntu@"$DEPLOY_HOST":/opt/agent-wiki/k3s-runtime/scripts/
          scp -i ~/.ssh/wiki -o StrictHostKeyChecking=yes infra/k3s/versions.env infra/k3s/pg_hba.conf ubuntu@"$DEPLOY_HOST":/opt/agent-wiki/k3s-runtime/infra/k3s/
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/wiki -o StrictHostKeyChecking=yes ubuntu@"$DEPLOY_HOST" "sudo bash /opt/agent-wiki/k3s-runtime/scripts/deploy-k3s.sh '$IMAGE_TAG' '$GHCR_USER'"
